{{- /*
Renders the expandable search field for the header.

By default shows a magnifier icon. On click/focus, expands to show the search input.
On Enter, submits search to /search/?q=<query>.
*/}}

<form class="site-search" role="search" action="{{ "search/" | relURL }}" method="get">
  <label for="site-search-input" class="visually-hidden">{{ T "search_label" }}</label>

  <div class="site-search__control">
    <input
      id="site-search-input"
      name="q"
      type="search"
      placeholder="{{ T "search_placeholder" }}"
      autocomplete="off"
      aria-expanded="false"
      aria-controls="site-search-results"
    >

    <button
      type="button"
      class="site-search__toggle"
      aria-label="{{ T "search_button" }}"
      aria-expanded="false"
      aria-controls="site-search-input"
    >
      <svg
        class="site-search__icon site-search__icon--search"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        width="20"
        height="20"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <svg
        class="site-search__icon site-search__icon--close"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        width="20"
        height="20"
        aria-hidden="true"
      >
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>

    <button
      type="submit"
      class="site-search__submit visually-hidden"
      aria-label="{{ T "search_button" }}"
    >
      {{ T "search_button" }}
    </button>
  </div>
</form>

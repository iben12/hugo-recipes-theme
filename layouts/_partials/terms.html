{{- $page := .page }}
{{- $taxonomy := .taxonomy }}
{{- $label := .label }}
{{- $showLabel := .showLabel | default false }}

{{- with $page.GetTerms $taxonomy }}
  <div class="recipe-terms" aria-label="{{ $label }}">
    {{- if $showLabel }}
      <span class="recipe-terms__label">{{ $label }}:</span>
    {{- end }}
    <ul class="recipe-terms__list">
      {{- range . }}
        <li><a href="{{ .RelPermalink }}" class="recipe-term">{{ .LinkTitle }}</a></li>
      {{- end }}
    </ul>
  </div>
{{- end }}
